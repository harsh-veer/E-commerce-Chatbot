[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce_bot_backend"
version = "0.1.0"
description = "AI-powered e-commerce Q&A bot backend"
authors = [
  { name = "AI Engineer", email = "ai@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11"
]

[project.dependencies]
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
pydantic = "^2.5.1"
motor = "^4.4.0"
python-jose = "^3.1.0"
"passlib[bcrypt]" = "^1.7.5"
langchain = "^0.1.0"
sentence-transformers = "^2.3.0"
pydantic-settings = "^2.0.0"
faiss-cpu = "^1.7.4"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pytest = "^8.4.0"
httpx = "^0.28.0"
loguru = "^0.7.0"

[project.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[tool.pytest.ini_options]
testpaths = ["tests"]
