[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce_bot_backend"
version = "0.1.0"
description = "AI-powered e-commerce Q&A bot backend"
authors = [
  { name = "AI Engineer", email = "ai@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.5.1",
    "pydantic[email]>=2.5.1",
    "email-validator>=2.0.0",
    "motor>=3.3.0",
    "python-jose>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pydantic-settings>=2.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
